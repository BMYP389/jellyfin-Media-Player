name: build-windows

env:
  MPV_VERSION: "20261108-git-55d3feb45c"
  QT_VERSION: "6.9.3"
  QT_INSTALL_DIR: "C:/qt/6.9.3/msvc2022_64"
  QT_BUILD_DIR: "C:/qt-build"
  QT_SRC_DIR: "C:/qt-src"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            qt_arch: win64_msvc2022_64
            mpv_arch: x86_64
            mpv_arch_fallback: ""
            vc_redist_arch: x64
            machine: X64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up MSVC x64 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Restore cached Qt 6 build and install
      id: qt-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.QT_INSTALL_DIR }}
          ${{ env.QT_BUILD_DIR }}
        key: qt-src-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-noavx2-webengine-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          qt-src-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-noavx2-webengine-
          qt-src-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-noavx2-

    - name: Install Qt 6 build prerequisites
      if: "!hashFiles('C:/qt/6.9.3/msvc2022_64/lib/cmake/Qt6WebEngineQuick/Qt6WebEngineQuickConfig.cmake')"
      run: |
        choco install winflexbison3 gperf nodejs-lts -y
        python -m pip install --upgrade pip
        python -m pip install html5lib spdx-tools
      shell: powershell

   - name: Download Qt ${{ env.QT_VERSION }} source
      if: "!hashFiles('C:/qt/6.9.3/msvc2022_64/lib/cmake/Qt6WebEngineQuick/Qt6WebEngineQuickConfig.cmake')"
      run: |
        $ver = "${{ env.QT_VERSION }}"
        $majorMinor = $ver.Substring(0, $ver.LastIndexOf('.'))
        $hostName = "download.qt.io"
        $path = "archive/qt/$majorMinor/$ver/single/qt-everywhere-src-$ver.tar.xz"
        $url = "https://" + $hostName + "/" + $path
        Write-Host "Downloading $url"
        curl.exe -fL "$url" -o qt-src.tar.xz
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if ((Get-Item qt-src.tar.xz).Length -lt 100MB) {
            Write-Error "Downloaded file is too small (likely an HTML page instead of the Qt tarball)."
            exit 1
        }
        New-Item -ItemType Directory -Force -Path "${{ env.QT_SRC_DIR }}" | Out-Null
        tar -xf qt-src.tar.xz -C "${{ env.QT_SRC_DIR }}" --strip-components=1
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Remove-Item -Force qt-src.tar.xz
      shell: powershell


    - name: Build Qt ${{ env.QT_VERSION }} from source (no-avx2)
      id: build-qt
      if: "!hashFiles('C:/qt/6.9.3/msvc2022_64/lib/cmake/Qt6WebEngineQuick/Qt6WebEngineQuickConfig.cmake')"
      timeout-minutes: 330
      continue-on-error: true
      run: |
        $env:PATH = "C:\ProgramData\chocolatey\bin;C:\Program Files\nodejs;$env:PATH"
        $pyExe = (Get-Command python).Source -replace '\\', '/'
        New-Item -ItemType Directory -Force -Path "${{ env.QT_BUILD_DIR }}" | Out-Null
        Set-Location "${{ env.QT_BUILD_DIR }}"
        if (Test-Path "CMakeCache.txt") { Remove-Item -Force "CMakeCache.txt" }
        & "${{ env.QT_SRC_DIR }}\configure.bat" `
          -prefix "${{ env.QT_INSTALL_DIR }}" `
          -opensource -confirm-license `
          -release `
          -no-avx -no-avx2 -no-avx512 `
          -nomake examples -nomake tests `
          -submodules qtbase,qtshadertools,qtdeclarative,qtwebchannel,qtpositioning,qtwebengine `
          -- -DQT_FEATURE_webengine_proprietary_codecs=OFF -DPython3_EXECUTABLE="$pyExe"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Get-Content config.summary
        if (-not (Select-String -Path config.summary -Pattern "Build QtWebEngine \.+ yes")) {
            Write-Error "QtWebEngine was disabled during configure! See config.summary above."
            exit 1
        }
        cmake --build . --parallel
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cmake --install .
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if (-not (Test-Path "${{ env.QT_INSTALL_DIR }}\lib\cmake\Qt6WebEngineQuick\Qt6WebEngineQuickConfig.cmake")) {
            Write-Error "Qt6WebEngineQuickConfig.cmake was still not generated!"
            exit 1
        }
      shell: powershell

    - name: Save Qt 6 build and install cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.QT_INSTALL_DIR }}
          ${{ env.QT_BUILD_DIR }}
        key: qt-src-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-noavx2-webengine-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Verify Qt 6 build completed
      if: steps.build-qt.outcome == 'failure' || steps.build-qt.outcome == 'cancelled'
      run: |
        echo "Qt 6 build did not finish within the 5.5-hour window or failed. Partial progress has been cached; re-run this workflow to resume."
        exit 1
      shell: bash

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: powershell

    - name: Install dependencies
      run: |
        mkdir build
        curl -L https://sourceforge.net{{ matrix.mpv_arch }}-${{ env.MPV_VERSION }}.7z/download > mpv.7z
        7z x mpv.7z
        mkdir mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/
        if [ -n "${{ matrix.mpv_arch_fallback }}" ]; then
          curl -L https://sourceforge.net{{ matrix.mpv_arch_fallback }}-${{ env.MPV_VERSION }}.7z/download > mpv-fallback.7z
          7z x mpv-fallback.7z -ompv-fallback-tmp
          mkdir build/mpv-fallback
          mv mpv-fallback-tmp/libmpv-2.dll build/mpv-fallback/
        fi
      shell: bash

    - name: Bundle VC runtime DLLs
      run: |
        mkdir deps
        mkdir deps/vcruntime
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        if (-not $vsPath) {
            $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*" | Where-Object { Test-Path "$_\VC\Redist\MSVC" } | Select-Object -First 1).FullName
        }
        $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.vc_redist_arch }}\Microsoft.VC*.CRT" | Select-Object -First 1
        if (-not $vsRedist) {
            $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -like "*${{ matrix.vc_redist_arch }}*" } | Select-Object -First 1
        }
        Copy-Item "$vsRedist\*.dll" deps/vcruntime/
        Invoke-WebRequest -Uri "https://aka.ms" -OutFile deps/vc_redist.x64.exe
      shell: powershell

    - name: Build
      run: |
        cd build
        $env:PATH = "$env:PATH;C:\Program Files (x86)\Inno Setup 6;$PWD;${{ env.QT_INSTALL_DIR }}\bin"
        $env:QT_ROOT_DIR = "${{ env.QT_INSTALL_DIR }}"
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DQTROOT=$env:QT_ROOT_DIR -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DCHECK_FOR_UPDATES=ON -DUSE_STATIC_MPVQT=ON ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:${{ matrix.machine }}
        ninja
        ninja windows_all
      shell: powershell

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-installer
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe

    - name: Archive portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-portable
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.zip
